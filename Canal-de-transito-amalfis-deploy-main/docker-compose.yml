services:
  canal-de-transito-backend:
    image: 015356265371.dkr.ecr.us-east-1.amazonaws.com/canal-de-transito-backend
    container_name: canal-de-transito-backend
    expose:
      - "3001"
    env_file:
      - ./.back.env
    networks:
      - webproxy

  canal-de-transito-front:
    image: 015356265371.dkr.ecr.us-east-1.amazonaws.com/canal-de-transito-front
    container_name: canal-de-transito-front
    expose:
      - "3000"
    env_file:
      - ./.front.env
    environment:
      API_PROXY_TARGET: http://canal-de-transito-backend:3001
    networks:
      - webproxy

networks:
  webproxy:
    external: true
