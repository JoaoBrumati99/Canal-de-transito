plan_id: 20261125-endereco-reverso-nominatim
status: in_progress
tldr: |
  Replace GeocodeBR in the active reverse-geocoding flow with a consent-gated
  backend integration to public Nominatim, while preserving manual address
  entry and completed form changes. Keep every real upstream request disabled
  in all environments until privacy eligibility and a global rate limit are
  verified.
current_objective: "Use public OpenStreetMap Nominatim through the application backend only if a deployment feasibility preflight and independent review identify enforceable all-environment privacy and rate-limit controls; otherwise remain no-go."
current_acceptance_criteria:
  - "Verify that explicit consent and a disclosure identifying Nominatim/OpenStreetMap as the recipient are shown before geolocation; cancellation requests no location and transmits no coordinates."
  - "Verify that a Nominatim result fills the available street/address, neighborhood, city, and postal-code fields without inventing missing values, and remains editable."
  - "Verify that street maps only from address.road; neighborhood maps to the first nonempty suburb/neighbourhood/city_district; city maps to the first nonempty city/town/village/municipality; postcode maps from address.postcode; and missing fields are omitted."
  - "Verify that reverse-geocoding requests go through the application backend, identify the application with a policy-compliant User-Agent or Referer, and provide OpenStreetMap attribution."
  - "Verify that aggregate outbound traffic never exceeds one Nominatim request per second across the deployed application, with a reasonable cache and no aggressive retries."
  - "Verify that coordinates and addresses are absent from application logs; on lookup failure, acquired coordinates remain locally available and a visible explicit action can insert them into the address without silently replacing manual text or making another request."
  - "Verify that every real upstream request is hard-disabled by default in every environment and can be enabled only through the enforceable mechanism confirmed by preflight and reviewer, after an explicit approval artifact from an authorized privacy owner and a verified deployment-wide limiter."
  - "Verify that absent or unresolved privacy approval, missing control paths, or unavailable limiter blocks all upstream calls; user consent is not privacy eligibility."
  - "Verify that mock-only code/tests proceed only after reviewer approval of safe implementation controls, and that no live Nominatim request is made."
  - "Verify that form feedback, vehicle selection, completed plate removal, and all other form behavior remain intact."
created_at: "2026-11-25T16:30:16-03:00"
created_by: planner
revision: 22
replan_count: 22
planner_revision_used: false

decisions:
  - "Make Nominatim the active provider because the user's current explicit selection supersedes the completed GeocodeBR direction."
  - "Keep privacy approval and deployment-wide rate limiting as separate production gates because consent alone does not settle whether complaint coordinates may be sent to a public third party."
  - "Implement and test the provider flow with mocked upstream calls while production remains disabled, so no real user coordinates or unnecessary test traffic reach Nominatim."
  - "Keep every real request hard-disabled by default; choose a concrete gate only after inspecting the actual deployment and release path, and do not assume signing infrastructure."
  - "Require explicit privacy eligibility as an approval artifact from the authorized privacy owner; browser consent does not satisfy this gate."
  - "Use explicit documented Nominatim address-field mappings and describe returned results as potentially nearby features, not guaranteed incident locations."
  - "Map street only from address.road; retain geolocation coordinates transiently in client memory after lookup failure for an explicit, non-network fallback action."
  - "Retain the existing Node/Express browser-facing API boundary and Vite development proxy."
  - "Preserve superseded GeocodeBR code until the Nominatim replacement is validated; do not make cleanup part of the provider migration."
  - "Do not include service activation in this plan; every environment must fail closed when either release gate is missing."
  - "If preflight finds no enforceable all-environment egress gate or shared one-request-per-second limiter, stop as no-go and request user direction rather than inventing infrastructure."
assumptions:
  - "The existing frontend is React/Vite, the backend is Node.js/Express, and deployment uses Docker Compose behind an externally managed proxy."
  - "The authorized privacy owner and any approval artifact format are not known until the Wave 1 preflight."
  - "No live Nominatim requests are needed to implement or validate this change; upstream behavior is covered with fixtures and mocked tests."

baseline:
  objective: "Atualizar o botao de localizacao atual para preencher o endereco da rua por geocodificacao reversa usando OpenStreetMap Nominatim, escolhido pelo usuario. O browser ja solicita geolocalizacao e atualmente preenche coordenadas."
  acceptance_criteria:
    - "Apos consentimento explicito e permissao de geolocalizacao, converter latitude/longitude em endereco legivel da rua com Nominatim e inserir no campo de endereco."
    - "Informar claramente antes da acao que a localizacao sera compartilhada com OpenStreetMap/Nominatim."
    - "Tratar endereco nao encontrado, falha de rede, permissao negada e indisponibilidade sem bloquear edicao manual nem descartar silenciosamente as coordenadas uteis."
    - "Nao quebrar o comportamento/formulario existente; atribuir credito OpenStreetMap quando os dados retornados forem usados."
    - "Validar lint/build e casos de comportamento relevantes."
  captured_at: "2026-11-25T16:30:16-03:00"

